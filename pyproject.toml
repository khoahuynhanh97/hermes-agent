[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent"
version = "1.0.0"
description = "Hermes — Video Factory, Knowledge, media runtime, and core agent"
requires-python = ">=3.10,<3.14"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.17.0",
    "requests>=2.31.0",
    "jinja2>=3.0.0",
    "croniter>=1.3.0",
    "packaging>=23.0",
    "Markdown>=3.0",
    "PyJWT[crypto]>=2.8.0",
    "psutil>=5.9.0",
    "websockets>=12.0",
    "pathspec>=0.11.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.9",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "google-auth>=2.30.0",
    "fire>=0.5.0",
    "httpx>=0.25.0",
    "concurrent-log-handler>=0.9.29; sys_platform == 'win32'",
    "portalocker>=2.0.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "tzdata>=2024.1; sys_platform == 'win32'",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mcp>=1.0.0",
]

[project.scripts]
hermes = "hermes_cli.main:main"
hermes-agent = "run_agent:main"
hermes-acp = "acp_adapter.entry:main"

[tool.setuptools]
py-modules = [
    "run_agent",
    "model_tools",
    "toolsets",
    "batch_runner",
    "trajectory_compressor",
    "toolset_distributions",
    "cli",
    "hermes_bootstrap",
    "hermes_constants",
    "hermes_state",
    "hermes_state_common",
    "hermes_state_portability",
    "hermes_state_schema",
    "hermes_state_search",
    "hermes_time",
    "hermes_logging",
    "utils",
    "mcp_serve",
]

[tool.setuptools.packages.find]
include = [
    "hermes",
    "hermes.*",
    "agent",
    "agent.*",
    "tools",
    "tools.*",
    "hermes_cli",
    "hermes_cli.*",
    "gateway",
    "gateway.*",
    "tui_gateway",
    "tui_gateway.*",
    "cron",
    "cron.*",
    "acp_adapter",
    "plugins",
    "plugins.*",
    "providers",
    "providers.*",
    "mcp_servers",
    "mcp_servers.*",
    "workers",
    "workers.*",
]
