<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2800" viewBox="0 0 2000 2800">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10263e"/></linearGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087f75"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="hm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e40af"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="pr" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b21b6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#9cc4e8"/></marker>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#34d399"/></marker>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#eff7ff}.title{font-size:44px;font-weight:750}.sub{font-size:21px;fill:#aec9df}.lane{font-size:27px;font-weight:750}.h{font-size:23px;font-weight:700}.b{font-size:18px;fill:#dcecf8}.sm{font-size:15px;fill:#bcd2e5}.xs{font-size:13px;fill:#a7bfd4}.box{rx:18;stroke-width:2;filter:url(#s)}.line{fill:none;stroke:#9cc4e8;stroke-width:4;marker-end:url(#a)}.green{fill:none;stroke:#34d399;stroke-width:4;marker-end:url(#ag)}.dash{stroke-dasharray:10 8}
    </style>
  </defs>
  <rect width="2000" height="2800" fill="url(#bg2)"/>
  <circle cx="1760" cy="160" r="300" fill="#155e75" opacity=".16"/>
  <circle cx="140" cy="2500" r="330" fill="#312e81" opacity=".16"/>

  <text x="1000" y="70" text-anchor="middle" class="title">CANONICAL DAILY PRODUCT → VIDEO PIPELINE</text>
  <text x="1000" y="108" text-anchor="middle" class="sub">Product-Intelligence tìm và chuẩn hóa · Hermes chọn, duyệt và điều phối · Provider chỉ thực thi generation</text>

  <!-- lanes -->
  <rect x="55" y="150" width="590" height="2510" rx="28" fill="#09272c" stroke="#168f83" stroke-width="2"/>
  <rect x="705" y="150" width="590" height="2510" rx="28" fill="#0d2345" stroke="#3b82f6" stroke-width="2"/>
  <rect x="1355" y="150" width="590" height="2510" rx="28" fill="#24164a" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="55" y="150" width="590" height="70" rx="28" fill="#0f766e"/><rect x="705" y="150" width="590" height="70" rx="28" fill="#1d4ed8"/><rect x="1355" y="150" width="590" height="70" rx="28" fill="#6d28d9"/>
  <text x="350" y="195" text-anchor="middle" class="lane">PRODUCT-INTELLIGENCE</text>
  <text x="1000" y="195" text-anchor="middle" class="lane">HERMES UPSTREAM</text>
  <text x="1650" y="195" text-anchor="middle" class="lane">EXECUTION PROVIDERS</text>

  <!-- Product Intelligence daily flow -->
  <g>
    <rect class="box" x="115" y="270" width="470" height="105" fill="url(#pi)" stroke="#34d399"/>
    <text x="350" y="310" text-anchor="middle" class="h">1 · DAILY SCOUT</text>
    <text x="350" y="341" text-anchor="middle" class="b">Scheduler/Cron/catch-up → request.txt</text>
    <text x="350" y="365" text-anchor="middle" class="sm">Ngày + category + price + market + target count</text>
    <path class="green" d="M350 375V420"/>

    <rect class="box" x="115" y="430" width="470" height="120" fill="#0f514d" stroke="#2dd4bf"/>
    <text x="350" y="469" text-anchor="middle" class="h">2 · DISCOVER CANDIDATE POOL</text>
    <text x="350" y="501" text-anchor="middle" class="b">Trends · open web · TikTok/Shopee cues</text>
    <text x="350" y="529" text-anchor="middle" class="sm">10–30 candidates · chống trùng theo lịch sử</text>
    <path class="green" d="M350 550V595"/>

    <rect class="box" x="115" y="605" width="470" height="150" fill="#0f514d" stroke="#2dd4bf"/>
    <text x="350" y="644" text-anchor="middle" class="h">3 · ENRICH &amp; PREPARE</text>
    <text x="350" y="677" text-anchor="middle" class="b">Canonical product/variant + evidence</text>
    <text x="350" y="706" text-anchor="middle" class="b">Download · decode · dedup reference images</text>
    <text x="350" y="735" text-anchor="middle" class="sm">ResearchSnapshot + ResourcePack draft</text>
    <path class="green" d="M350 755V800"/>

    <rect class="box" x="115" y="810" width="470" height="125" fill="#123b3b" stroke="#34d399"/>
    <text x="350" y="849" text-anchor="middle" class="h">4 · PUBLISH DAILY BATCH</text>
    <text x="350" y="881" text-anchor="middle" class="b">products.json hoặc MCP response</text>
    <text x="350" y="909" text-anchor="middle" class="sm">Discovery output · chưa phải production manifest</text>
  </g>

  <!-- Handoff -->
  <path class="line" d="M585 872H755"/>
  <rect x="610" y="836" width="120" height="30" rx="15" fill="#12263b" stroke="#60a5fa"/>
  <text x="670" y="857" text-anchor="middle" class="xs">READ-ONLY</text>

  <!-- Hermes portfolio planning -->
  <g>
    <rect class="box" x="765" y="270" width="470" height="115" fill="url(#hm)" stroke="#60a5fa"/>
    <text x="1000" y="309" text-anchor="middle" class="h">5 · INGEST &amp; ADMISSION</text>
    <text x="1000" y="341" text-anchor="middle" class="b">Đọc batch một lần · không discovery lại</text>
    <text x="1000" y="369" text-anchor="middle" class="sm">≥2 ảnh đọc được · identity rõ · có evidence</text>
    <path class="line" d="M1000 385V430"/>

    <rect class="box" x="765" y="440" width="470" height="140" fill="#173f73" stroke="#60a5fa"/>
    <text x="1000" y="479" text-anchor="middle" class="h">6 · RANK &amp; CONTENT DIRECTION</text>
    <text x="1000" y="511" text-anchor="middle" class="b">Trend · content potential · media readiness</text>
    <text x="1000" y="540" text-anchor="middle" class="b">Angle · hook · audience · CTA · must-show</text>
    <text x="1000" y="567" text-anchor="middle" class="sm">Đề xuất image_provider + video_provider</text>
    <path class="line" d="M1000 580V625"/>

    <rect class="box" x="765" y="635" width="470" height="100" fill="#992d49" stroke="#fb7185"/>
    <text x="1000" y="674" text-anchor="middle" class="h">HITL 0 · DAILY LINEUP</text>
    <text x="1000" y="706" text-anchor="middle" class="b">Duyệt / sửa / reorder 3–5 sản phẩm</text>
    <path class="line" d="M1000 735V780"/>

    <rect class="box" x="765" y="790" width="470" height="145" fill="#18365e" stroke="#60a5fa"/>
    <text x="1000" y="829" text-anchor="middle" class="h">7 · FREEZE PRODUCTION MANIFEST</text>
    <text x="1000" y="861" text-anchor="middle" class="b">Immutable manifest_id + digest + approval</text>
    <text x="1000" y="890" text-anchor="middle" class="sm">snapshot/pack refs · assets · direction · providers</text>
    <text x="1000" y="916" text-anchor="middle" class="sm">workflow_id · project_id · idempotency_key</text>
  </g>

  <!-- Provider note -->
  <g>
    <rect class="box" x="1415" y="310" width="470" height="245" fill="#332063" stroke="#a78bfa"/>
    <text x="1650" y="350" text-anchor="middle" class="h">PROVIDER BOUNDARY</text>
    <text x="1455" y="389" class="b">• Không tìm sản phẩm</text>
    <text x="1455" y="421" class="b">• Không tự chọn daily lineup</text>
    <text x="1455" y="453" class="b">• Không bỏ qua HITL/budget</text>
    <text x="1455" y="495" class="sm">Chỉ nhận request chuẩn và trả artifact/job</text>
    <text x="1455" y="521" class="sm">theo một contract chung cho mọi backend</text>
  </g>

  <!-- Fan-out divider -->
  <line x1="85" y1="995" x2="1915" y2="995" stroke="#436581" stroke-width="2"/>
  <rect x="680" y="970" width="640" height="50" rx="25" fill="#0b1c2d" stroke="#34d399" stroke-width="2"/>
  <text x="1000" y="1003" text-anchor="middle" class="h">FAN-OUT: 3–5 WORKFLOWS · LOOP DƯỚI ĐÂY CHẠY CHO TỪNG SẢN PHẨM</text>

  <!-- per-product PI binding -->
  <g>
    <rect class="box" x="115" y="1060" width="470" height="150" fill="#0f514d" stroke="#2dd4bf"/>
    <text x="350" y="1098" text-anchor="middle" class="h">8 · BIND EXISTING RESEARCH</text>
    <text x="350" y="1130" text-anchor="middle" class="b">Snapshot + ready-to-lock Resource Pack</text>
    <text x="350" y="1159" text-anchor="middle" class="sm">Không chạy lại broad discovery</text>
    <text x="350" y="1185" text-anchor="middle" class="sm">PI vẫn sở hữu facts, claims và media</text>
    <path class="line" d="M585 1135H765"/>
  </g>

  <!-- per-product Hermes workflow -->
  <g>
    <rect class="box" x="765" y="1060" width="470" height="105" fill="#173f73" stroke="#60a5fa"/>
    <text x="1000" y="1099" text-anchor="middle" class="h">9 · CREATE DURABLE WORKFLOW</text>
    <text x="1000" y="1131" text-anchor="middle" class="b">Persist product, assets, direction, providers</text>
    <path class="line" d="M1000 1165V1205"/>

    <rect class="box" x="765" y="1215" width="470" height="88" fill="#992d49" stroke="#fb7185"/>
    <text x="1000" y="1250" text-anchor="middle" class="h">HITL 1 · PRODUCT LOCK</text>
    <text x="1000" y="1279" text-anchor="middle" class="sm">Khóa đúng product · variant · claims · media</text>
    <path class="line" d="M1000 1303V1340"/>

    <rect class="box" x="765" y="1350" width="470" height="112" fill="#173f73" stroke="#60a5fa"/>
    <text x="1000" y="1388" text-anchor="middle" class="h">10 · BRIEF → HITL 2</text>
    <text x="1000" y="1420" text-anchor="middle" class="b">Áp daily content direction vào creative brief</text>
    <text x="1000" y="1447" text-anchor="middle" class="sm">Operator duyệt concept và allowed claims</text>
    <path class="line" d="M1000 1462V1498"/>

    <rect class="box" x="765" y="1508" width="470" height="112" fill="#173f73" stroke="#60a5fa"/>
    <text x="1000" y="1546" text-anchor="middle" class="h">11 · SCENE PLAN → HITL 3</text>
    <text x="1000" y="1578" text-anchor="middle" class="b">Shots · prompts · required references</text>
    <text x="1000" y="1605" text-anchor="middle" class="sm">Duyệt cấu trúc trước khi tạo ảnh</text>
  </g>

  <!-- keyframe provider branch -->
  <path class="line" d="M1235 1564H1415"/>
  <g>
    <rect class="box" x="1415" y="1435" width="470" height="110" fill="url(#pr)" stroke="#a78bfa"/>
    <text x="1650" y="1474" text-anchor="middle" class="h">IMAGE A · VERTEX/API</text>
    <text x="1650" y="1506" text-anchor="middle" class="b">KeyframeRequest → image artifact</text>
    <text x="1650" y="1532" text-anchor="middle" class="sm">API path · active</text>
    <rect class="box" x="1415" y="1570" width="470" height="135" fill="#3b246e" stroke="#a78bfa"/>
    <text x="1650" y="1609" text-anchor="middle" class="h">IMAGE B · VISUAL BROWSER MCP</text>
    <text x="1650" y="1641" text-anchor="middle" class="b">Upload refs → Google Flow → download</text>
    <text x="1650" y="1669" text-anchor="middle" class="sm">Persistent profile · evidence · retry · active</text>
  </g>
  <path class="green" d="M1415 1490H1320V1745H1235"/>
  <path class="green" d="M1415 1638H1320"/>

  <g>
    <rect class="box" x="765" y="1720" width="470" height="115" fill="#173f73" stroke="#60a5fa"/>
    <text x="1000" y="1758" text-anchor="middle" class="h">12 · VISUAL STORYBOARD → HITL 4</text>
    <text x="1000" y="1790" text-anchor="middle" class="b">Freeze approved keyframe artifact refs</text>
    <text x="1000" y="1817" text-anchor="middle" class="sm">Provider-independent storyboard contract</text>
    <path class="line" d="M1000 1835V1880"/>

    <rect class="box" x="765" y="1890" width="470" height="140" fill="#173f73" stroke="#60a5fa"/>
    <text x="1000" y="1928" text-anchor="middle" class="h">13 · BUDGET + VIDEO RENDER</text>
    <text x="1000" y="1960" text-anchor="middle" class="b">Reserve → submit once → save operation ID</text>
    <text x="1000" y="1989" text-anchor="middle" class="sm">Poll/resume · không submit lại khi replay</text>
    <text x="1000" y="2015" text-anchor="middle" class="sm">VideoRenderRequest dùng provider đã bind</text>
  </g>

  <!-- video provider branch -->
  <path class="line" d="M1235 1960H1415"/>
  <g>
    <rect class="box" x="1415" y="1835" width="470" height="112" fill="url(#pr)" stroke="#a78bfa"/>
    <text x="1650" y="1874" text-anchor="middle" class="h">VIDEO A · VERTEX AI VEO</text>
    <text x="1650" y="1906" text-anchor="middle" class="b">API submit → operation → MP4</text>
    <text x="1650" y="1932" text-anchor="middle" class="sm">Active provider</text>
    <rect class="box" x="1415" y="1970" width="470" height="122" fill="#82430d" stroke="#fbbf24"/>
    <text x="1650" y="2009" text-anchor="middle" class="h">VIDEO B · GOOGLE FLOW</text>
    <text x="1650" y="2041" text-anchor="middle" class="b">Playwright generation → download MP4</text>
    <text x="1650" y="2068" text-anchor="middle" class="sm">Planned · Visual Browser hiện image-only</text>
  </g>
  <path class="green" d="M1415 1891H1320V2145H1235"/>
  <path class="line dash" d="M1415 2031H1320"/>

  <g>
    <rect class="box" x="765" y="2115" width="470" height="95" fill="#992d49" stroke="#fb7185"/>
    <text x="1000" y="2153" text-anchor="middle" class="h">HITL 5 · FINAL VIDEO APPROVAL</text>
    <text x="1000" y="2183" text-anchor="middle" class="sm">Duyệt MP4 trước export và delivery</text>
    <path class="line" d="M1000 2210V2250"/>

    <rect class="box" x="765" y="2260" width="470" height="125" fill="url(#hm)" stroke="#60a5fa"/>
    <text x="1000" y="2299" text-anchor="middle" class="h">14 · EXPORT &amp; DELIVER</text>
    <text x="1000" y="2331" text-anchor="middle" class="b">Final MP4 + metadata + delivery event</text>
    <text x="1000" y="2359" text-anchor="middle" class="sm">Workflow completed hoặc actionable failure</text>
  </g>

  <!-- feedback and capacity -->
  <g>
    <rect class="box" x="115" y="2260" width="470" height="185" fill="#123b3b" stroke="#34d399"/>
    <text x="350" y="2299" text-anchor="middle" class="h">15 · DAILY PORTFOLIO STATUS</text>
    <text x="350" y="2331" text-anchor="middle" class="b">3–5 item outcomes · produced/failed/blocked</text>
    <text x="350" y="2360" text-anchor="middle" class="sm">Feed suppression, diversity và lessons</text>
    <text x="350" y="2395" text-anchor="middle" class="sm">Ngày sau không lặp sản phẩm/angle ngoài ý muốn</text>

    <rect class="box" x="1415" y="2260" width="470" height="185" fill="#332063" stroke="#a78bfa"/>
    <text x="1650" y="2299" text-anchor="middle" class="h">CAPACITY POLICY</text>
    <text x="1650" y="2331" text-anchor="middle" class="b">Browser: tuần tự theo Chrome profile</text>
    <text x="1650" y="2360" text-anchor="middle" class="b">Vertex: bounded parallelism + quota</text>
    <text x="1650" y="2395" text-anchor="middle" class="sm">3–5 workflow/ngày không chạy paid jobs ồ ạt</text>
  </g>
  <path class="line" d="M765 2323H585"/>

  <!-- cross cutting -->
  <rect x="115" y="2520" width="1770" height="95" rx="24" fill="#0b1c2d" stroke="#34d399" stroke-width="2"/>
  <text x="1000" y="2558" text-anchor="middle" class="h">DURABLE CONTROL PLANE</text>
  <text x="1000" y="2591" text-anchor="middle" class="b">SQLite · outbox · manifest/workflow versions · artifact digests · approval receipts · budgets · checkpoints · replay safety</text>
  <text x="1000" y="2690" text-anchor="middle" class="sub">Nguyên tắc: Product-Intelligence cung cấp sự thật đã chuẩn hóa; Hermes quyết định và điều phối; provider tạo media.</text>
</svg>
